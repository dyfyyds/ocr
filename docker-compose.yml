# ============================================================
#  智能项目管理系统 - Docker Compose 开发环境（热加载）
#
#  使用:
#    docker compose up -d          # 启动所有服务
#    docker compose restart backend # 后端代码改动后重启（uvicorn --reload 通常自动重载）
#    docker compose logs -f backend # 查看后端日志
#    docker compose logs -f frontend # 查看前端日志
#    docker compose down            # 停止所有服务（保留数据）
#    docker compose down -v         # 停止并删除数据卷
# ============================================================

services:

  # ==================== MySQL 8.0 ====================
  mysql:
    image: mysql:8.0
    container_name: pm-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: Asia/Shanghai
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - ./mysql-data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
      - --max-connections=500
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - pm-network

  # ==================== 后端 (FastAPI + uvicorn --reload) ====================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pm-backend
    restart: unless-stopped
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      JWT_SECRET: ${JWT_SECRET}
      OCR_ENGINE: ${OCR_ENGINE:-paddleocr}
      LLM_API_URL: ${LLM_API_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-mimo-v2.5-pro}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      - ./backend:/app
      - ./uploads:/app/uploads
      # PaddleOCR 模型缓存持久化（避免无网络时重新下载）
      - paddlex-models:/root/.paddlex
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - pm-network

  # ==================== 前端 (Vite 开发服务器 + HMR 热加载) ====================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pm-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      # 挂载源码，修改即时生效（Vite HMR）
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/spa.html:/app/spa.html
      - ./frontend/index.html:/app/index.html
      - ./frontend/app.js:/app/app.js
      - ./frontend/style.css:/app/style.css
      - ./frontend/vite.config.js:/app/vite.config.js
      # OCR-IPMS 分层模块：utils / clients / composables（与 app.js 同级，<script> 加载）
      # 注：用 clients/ 而非 api/ —— nginx 把 /api/* 反代到后端，会与浏览器请求冲突。
      - ./frontend/utils:/app/utils
      - ./frontend/clients:/app/clients
      - ./frontend/composables:/app/composables
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - pm-network

  # ==================== Nginx 反向代理 ====================
  nginx:
    image: nginx:alpine
    container_name: pm-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80/ > /dev/null 2>&1 || exit 0"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - pm-network

# ==================== 卷 ====================
volumes:
  paddlex-models:
    external: true

# ==================== 网络 ====================
networks:
  pm-network:
    driver: bridge
